name: Infrastructure Update Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/my-app

jobs:
  # ==========================================
  # JOB 1: Continuous Integration (CI)
  # ==========================================
  ci-tests:
    name: CI - Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test

  # ==========================================
  # JOB 2: Build, Scan and Push
  # ==========================================
  build-and-push:
    name: Build Docker & Security Scan
    needs: ci-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          IMAGE_ID=$(echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | tr '[A-Z]' '[a-z]')
          TAG="v1.0.${{ github.run_number }}"
          docker build -t $IMAGE_ID:$TAG .
          echo "FULL_IMAGE_NAME=$IMAGE_ID:$TAG" >> $GITHUB_ENV

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FULL_IMAGE_NAME }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to GHCR
        run: docker push ${{ env.FULL_IMAGE_NAME }}

  # ==========================================
  # JOB 3: GitOps Update
  # ==========================================
  gitops-update:
    name: Update Helm values.yaml
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Required to trigger other workflows if necessary, or push to branch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Image Tag using yq
        run: |
          NEW_TAG="v1.0.${{ github.run_number }}"
          echo "Updating Helm chart with tag: $NEW_TAG"
          
          # Use yq to update the tag field inside values.yaml
          yq -i ".image.tag = \"$NEW_TAG\"" helm/my-app/values.yaml

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add helm/my-app/values.yaml
          git commit -m "chore(gitops): update image tag to v1.0.${{ github.run_number }} [skip ci]"
          git push origin main