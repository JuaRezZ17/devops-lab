services:
  prometheus:
    image: prom/prometheus
    container_name: dora-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  pushgateway:
    image: prom/pushgateway
    container_name: dora-pushgateway
    ports:
      - "9091:9091"

  grafana:
    image: grafana/grafana
    container_name: dora-grafana
    ports:
      - "3000:3000"